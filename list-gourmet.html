<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おすすめ飲食店一覧 | 足立さんおすすめ！大阪グルメ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="site-wrapper">

        <!-- 左サイドバー -->
        <aside class="side-navigation">
            <div class="side-header">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <img src="image/header-adachi.jpeg" alt="足立さん" class="side-avatar">
                    <h2>足立さんおすすめ！</h2>
                    <p class="side-subtitle">大阪グルメと厳選商品</p>
                </a>
            </div>
            
            <nav class="nav-links">
                <a href="index.html">← トップページへ戻る</a>
                <!-- 現在のページをハイライト表示 -->
                <a href="list-gourmet.html" style="background: #f4f4f4; font-weight: bold; border-left: 4px solid #2c3e50;">おすすめ飲食店 一覧</a>
                <a href="list-wish.html">いきたい飲食店 一覧</a>
                <a href="list-product.html">おすすめ商品（PR） 一覧</a>
            </nav>
        </aside>

        <!-- 右側：メインコンテンツ -->
        <main class="main-content">

            <!-- ステマ規制対策（PR表記） -->
            <div style="font-size: 0.75rem; color: #888; margin-top: 1rem; margin-bottom: 1rem; background: #f9f9f9; padding: 4px 10px; border-radius: 4px; display: inline-block;">
                ※ 当サイトはアフィリエイト広告を利用しています
            </div>

            <div class="section-header">
                <h1 style="font-size: 1.5rem; color: #2c3e50; margin: 0;">おすすめ飲食店 一覧</h1>
                <span>All Recommended Restaurants</span>
            </div>
            <p style="font-size: 0.95rem; color: #666; margin-bottom: 2rem; line-height: 1.6;">
                百貨店やスーパーで長年食品の現場を見てきた足立が実際に足を運び、確かな目利きで選んだ大阪の名店レポート一覧です。
            </p>

            <!-- 記事一覧を自動生成するグリッド -->
            <div class="grid" id="all-review-grid">
                <!-- JSで全件自動生成 -->
            </div>

            <footer style="margin-top: 4rem;">
                <p>&copy; 2026 足立さんおすすめ！厳選商品サイト All Rights Reserved.</p>
            </footer>

        </main>
    </div>

    <!-- データ読み込み ＆ 一覧の自動生成 -->
    <script src="articles.js"></script>
    <script>
        // type が 'review' の記事を【すべて】取得する（sliceを使わない）
        const allReviews = gourmetArticles.filter(a => a.type === 'review');
        const grid = document.getElementById('all-review-grid');
        
        if (grid) {
            if (allReviews.length > 0) {
                grid.innerHTML = allReviews.map(article => `
                    <article class="card">
                        <div class="card-image-wrap">
                            <div class="card-img-placeholder" style="background:#e2e8f0; height:100%; display:flex; align-items:center; justify-content:center; color:#718096; font-size:0.9rem;">
                                ${article.imagePlaceholder}
                            </div>
                        </div>
                        <div class="card-content">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                                <span class="category-tag">${article.tag}</span>
                                <span style="font-size: 0.8rem; color: #999;">${article.date}</span>
                            </div>
                            <h3 style="margin-top: 0.5rem;">${article.title}</h3>
                            <p class="card-desc">${article.lead.substring(0, 55)}...</p>
                        </div>
                        <a href="article.html?id=${article.id}" class="affiliate-btn" style="background-color: #2c3e50;">実食レポートを読む →</a>
                    </article>
                `).join('');
            } else {
                grid.innerHTML = '<p style="color: #666;">現在公開されている実食レポートはありません。</p>';
            }
        }
    </script>
</body>
</html>
